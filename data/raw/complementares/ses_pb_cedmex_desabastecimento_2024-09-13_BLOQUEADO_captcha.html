<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    :root {
        --azul: #0b5fa5;
        --azul-claro: #1e88e5;
        --amarelo: #ffcc00;
        --amarelo-claro: #ffeb3b;
        --vermelho: #e53935;
        --verde: #00c853;
        --cinza-claro: #f4f6f8;
        --cinza-borda: #e0e0e0;
        --preto: #111;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* ===== HEADER ===== */

    .top-black {
        height: 44px;
        background: var(--preto);
    }

    .color-strip {
        display: flex;
        height: 6px;
        width: 100%;
    }

    .color-strip div { flex: 1; }

    .yellow { background: var(--amarelo); }
    .red    { background: var(--vermelho); }
    .blue   { background: var(--azul-claro); }
    .green  { background: var(--verde); }

    .header-white {
        height: 72px;
        background: #fff;
        border-bottom: 1px solid var(--cinza-borda);
    }

    .bottom-yellow {
        height: 48px;
        background: var(--amarelo-claro);
    }

    /* ===== CONTEÚDO ===== */

    main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
    }

    .challenge-box {
        width: 100%;
        max-width: 480px;
        background: #fff;
        border: 1px solid var(--cinza-borda);
        border-radius: 8px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        padding: 24px;
        text-align: center;
    }

    .challenge-box h1 {
        font-size: 20px;
        color: #000;
        margin-bottom: 12px;
    }

    .challenge-box p {
        font-size: 14px;
        color: #333;
        margin-bottom: 16px;
    }

    .captcha-box {
        background: var(--cinza-claro);
        padding: 16px;
        border-radius: 6px;
        margin-top: 16px;
    }

    .captcha-media {
        margin-bottom: 12px;
    }

    .submit-area {
        margin-top: 16px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: var(--azul);
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover {
        background: var(--azul-claro);
    }

    .support-id {
        margin-top: 20px;
        font-size: 12px;
        color: #555;
    }
</style>
</head>

<body>

        <div class="green"></div>
    </div>

    <div class="header-white"></div>

    <div class="bottom-yellow"></div>
